<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walled Guard - Security Audit Log</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Header -->
  <header class="logs-header">
    <div class="header-title-container">
      <div class="header-icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div class="title-group">
        <div class="title-row">
          <h1>Security Audit Log</h1>
          <span class="live-status-chip">
            <span class="chip-pulse-dot"></span>
            LIVE AUDIT
          </span>
        </div>
        <div class="subtitle-pills">
          <span class="meta-pill count-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <span id="total-count-badge">0 events recorded</span>
          </span>
          <span class="meta-pill privacy-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            SHA-256 Hashes Only · Zero Plaintext Stored
          </span>
          <span class="meta-pill ledger-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Tamper-Evident Ledger
          </span>
        </div>
      </div>
    </div>
    <div class="controls-group">
      <button class="btn-action" id="btn-export-csv" title="Export events as CSV spreadsheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export CSV
      </button>
      <button class="btn-action" id="btn-export-json" title="Export events as JSON raw format">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
        Export JSON
      </button>
      <button class="btn-action danger" id="btn-clear-data" title="Permanently clear all audit records">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Clear All
      </button>
    </div>
  </header>

  <!-- Filter Toolbar -->
  <section class="card filter-card">
    <div class="filter-grid">
      <div class="filter-field">
        <label>Site</label>
        <select class="table-select" id="filter-site">
          <option value="">All Sites</option>
          <option value="chatgpt">ChatGPT</option>
          <option value="perplexity">Perplexity</option>
        </select>
      </div>

      <div class="filter-field">
        <label>Origin</label>
        <select class="table-select" id="filter-source">
          <option value="">All Origins</option>
          <option value="app">In-App</option>
          <option value="browser">Browser</option>
        </select>
      </div>

      <div class="filter-field">
        <label>Channel</label>
        <select class="table-select" id="filter-kind">
          <option value="">Prompts & Files</option>
          <option value="prompt">Prompts only</option>
          <option value="file">Files only</option>
        </select>
      </div>

      <div class="filter-field">
        <label>Decision</label>
        <select class="table-select" id="filter-decision">
          <option value="">All Decisions</option>
          <option value="cancelled">Blocked</option>
          <option value="continued">Approved</option>
          <option value="clean">Clean</option>
          <option value="scan_failed">Scan failed</option>
        </select>
      </div>

      <div class="filter-field search-field">
        <label>Search</label>
        <input type="text" class="table-search" id="filter-search" placeholder="Search filename, hash, or snippet...">
      </div>

      <div class="filter-field per-page-field">
        <label>Page Size</label>
        <select class="table-select" id="per-page-select">
          <option value="15">15 per page</option>
          <option value="25" selected>25 per page</option>
          <option value="50">50 per page</option>
          <option value="100">100 per page</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Events Audit Table Card -->
  <section class="card table-card">
    <div class="table-wrapper">
      <table class="events-table">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Site</th>
            <th>Origin</th>
            <th>Channel</th>
            <th>Item / Filename</th>
            <th>Content Hash</th>
            <th>Detection Source</th>
            <th>Decision</th>
            <th>Scan Latency</th>
          </tr>
        </thead>
        <tbody id="events-tbody">
          <tr><td colspan="9" style="text-align: center; color: var(--text-muted); padding: 32px;">Loading audit logs...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination Footer -->
    <div class="table-footer">
      <div class="pagination-info" id="pagination-info">
        Showing 0–0 of 0 events
      </div>
      <div class="pagination-controls">
        <button class="page-btn" id="btn-prev-page" disabled>&larr; Previous</button>
        <span class="page-current" id="page-current-label">Page 1</span>
        <button class="page-btn" id="btn-next-page" disabled>Next &rarr;</button>
      </div>
    </div>
  </section>

  <script src="./main.ts" type="module"></script>
</body>
</html>
